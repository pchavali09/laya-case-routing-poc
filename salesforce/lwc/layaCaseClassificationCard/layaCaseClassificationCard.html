<template>
    <article class="slds-card laya-container">
        <!-- Card Header -->
        <div class="slds-card__header slds-grid slds-grid_align-spread laya-header">
            <div class="slds-media slds-media_center slds-has-flexi-truncate">
                <div class="slds-media__figure">
                    <span class="laya-brand-icon">⚡</span>
                </div>
                <div class="slds-media__body">
                    <h2 class="laya-title">Laya Intelligent Routing</h2>
                    <p class="laya-subtitle">Local-First Calibrated Decision Engine</p>
                </div>
            </div>
            <div class="header-badges">
                <span class="latency-pill" title="Execution latency within local perimeter">⚡ {latencyText}</span>
                <span class={decisionPillClass}>{decisionLabel}</span>
            </div>
        </div>

        <div class="slds-card__body slds-card__body_inner laya-body">
            <template if:true={isLoading}>
                <div class="loading-state">
                    <lightning-spinner alternative-text="Analyzing case with Laya..." size="small"></lightning-spinner>
                    <p class="loading-text">Computing calibrated posterior probability...</p>
                </div>
            </template>

            <template if:false={isLoading}>
                <!-- Hero Decision Block -->
                <div class="hero-card">
                    <!-- Left: Department Routing Target -->
                    <div class="target-block">
                        <span class="eyebrow-label">RECOMMENDED QUEUE</span>
                        <div class="department-display">
                            <span class="department-text">{prediction.predictedDepartment}</span>
                        </div>
                        <div class="meta-row">
                            <span class="meta-chip language-chip">🌐 {prediction.language}</span>
                            <span class="meta-chip border-chip">Case #{recordId}</span>
                        </div>
                    </div>

                    <!-- Right: Calibrated Certainty Dial -->
                    <div class="score-block">
                        <span class="eyebrow-label">CALIBRATED CERTAINTY</span>
                        <div class="score-display">
                            <span class="score-val">{confidencePercentage}%</span>
                        </div>
                        <span class={gateStatusClass}>{gateStatusLabel}</span>
                    </div>
                </div>

                <!-- Confidence Gate Track Bar -->
                <div class="gate-track-wrapper">
                    <div class="track-header">
                        <span class="track-label">Posterior Probability Score</span>
                        <span class="track-gate-info">Safety Threshold: <strong>85.0%</strong></span>
                    </div>
                    <div class="track-bar">
                        <div class={progressFillClass} style={progressBarStyle}></div>
                        <!-- 85% Gate Marker Line -->
                        <div class="gate-line" style="left: 85%;" title="Automation Safety Gate (85%)">
                            <span class="gate-pin">85%</span>
                        </div>
                    </div>
                </div>

                <!-- Operational Reason Box -->
                <div class={alertBoxClass}>
                    <lightning-icon icon-name={alertIconName} size="x-small" class="alert-icon"></lightning-icon>
                    <p class="alert-text">{prediction.routingReason}</p>
                </div>

                <!-- Probability Distribution -->
                <div class="distribution-section">
                    <h3 class="distribution-title">Candidate Department Probabilities P(y|x)</h3>
                    <div class="prob-list">
                        <template for:each={prediction.probabilities} for:item="prob">
                            <div key={prob.department} class="prob-item">
                                <span class="prob-dept">{prob.department}</span>
                                <div class="prob-bar-rail">
                                    <div class={prob.barClass} style={prob.barStyle}></div>
                                </div>
                                <span class="prob-pct-label">{prob.percentage}%</span>
                            </div>
                        </template>
                    </div>
                </div>

                <!-- Footer Action -->
                <div class="laya-footer">
                    <template if:true={prediction.isApplied}>
                        <div class="audit-badge">
                            <lightning-icon icon-name="utility:check" size="x-small" class="audit-icon"></lightning-icon>
                            <span>Routing Applied & Logged to Case Audit Trail</span>
                        </div>
                    </template>
                    <template if:false={prediction.isApplied}>
                        <button class="apply-button" onclick={handleApplyClassification} disabled={isSaving}>
                            <template if:true={isSaving}>
                                <span>Applying Classification...</span>
                            </template>
                            <template if:false={isSaving}>
                                <span>⚡ Apply & Route Case</span>
                            </template>
                        </button>
                    </template>
                </div>
            </template>
        </div>
    </article>
</template>
